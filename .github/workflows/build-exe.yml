name: Build 3EN FIGHT Inspector EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "inspector.py"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check Python
        run: python -m py_compile inspector.py
      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build standalone Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 3EN_FIGHT_INSPECTOR inspector.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3EN-FIGHT-INSPECTOR-Windows
          path: dist/3EN_FIGHT_INSPECTOR.exe
          if-no-files-found: error
          retention-days: 30
