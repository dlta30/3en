name: Build 3en FIGHT Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 3en_fight_inspector inspector.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3en-fight-inspector-windows
          path: dist/3en_fight_inspector.exe
          if-no-files-found: error
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 3en FIGHT Inspector Build ${{ github.run_number }}
          make_latest: true
          files: dist/3en_fight_inspector.exe
